data:
  raw_path: data/raw/movies.csv
  processed_dir: data/processed/all_features
  split:
    train_ratio: 0.7
    val_ratio: 0.15
    test_ratio: 0.15
    seed: 42
  features:
    target: gross
    numeric_cols: [budget, votes, runtime, year]
    log_numeric_cols: [budget, votes]
    categorical_cols: [rating, genre, director, writer, star, country, company]
  cleaning:
    drop_missing_required: true
    # rare grouping/unknown handled in encode stage using train maps
    min_freq: 5

preprocess:
  # Uses src/data/encode_features.py
  log1p_target: true
  log1p_numeric: true
  scaler: standard
  rare_grouping: train_based   # fit on train, apply to val/test
  unknown_token: "Unknown"
  rare_token: "Other"

model:
  type: entity_embedding_mlp
  embedding_dim_rule: "min(50, round(sqrt(cardinality) + 1))"
  hidden_sizes: [256, 128, 64]
  dropout: 0.1
  use_batchnorm: true
  out_dim: 1

train:
  optimizer: adam
  lr: 1e-3
  loss: mse
  batch_size: 256
  epochs: 10
  shuffle: true